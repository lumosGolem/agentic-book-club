name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "lumosGolem@users.noreply.github.com"
          git config --global user.name "lumosGolem"
          git remote add hf https://lumosGolem:$HF_TOKEN@huggingface.co/spaces/lumosGolem/agents_book_club
          git fetch origin main
          git checkout main
          git push --force hf main
